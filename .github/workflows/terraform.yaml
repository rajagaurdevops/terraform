name: "Terraform CI/CD Pipeline"

on:
  push:
    branches:
      - main
    paths:
      - 'Create-Github-repo/**'
      - 'DAY-1/**'
      - 'Day-2/**'
      - 'Jenkins-Project/**'
      - 'aws-ec2/**'
      - 'aws-eks-cluster/**'
      - 'aws-s3/**'
      - 'aws-vpc-ec2-nginx/**'
      - 'aws-vpc/**'
      - 'azure-aks-cluster/**'
      - 'infrastructure/**'
      - 'modules/**'
      - 'pro-static-website/**'
      - 'tf_backend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Create-Github-repo/**'
      - 'DAY-1/**'
      - 'Day-2/**'
      - 'Jenkins-Project/**'
      - 'aws-ec2/**'
      - 'aws-eks-cluster/**'
      - 'aws-s3/**'
      - 'aws-vpc-ec2-nginx/**'
      - 'aws-vpc/**'
      - 'azure-aks-cluster/**'
      - 'infrastructure/**'
      - 'modules/**'
      - 'pro-static-website/**'
      - 'tf_backend/**'

# Least-privilege default; bump per-job if you later add PR comments, OIDC, etc.
permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: "TF: ${{ matrix.working_dir }}"
    runs-on: ubuntu-latest

    # One concurrency group PER DIRECTORY, not one for the whole workflow.
    # This still serializes two runs that touch the *same* directory (avoids
    # racing state locks) while letting unrelated directories deploy in parallel.
    concurrency:
      group: terraform-${{ matrix.working_dir }}
      cancel-in-progress: false

    strategy:
      fail-fast: false # Don't stop other deployments if one fails
      matrix:
        working_dir:
          - 'Create-Github-repo'
          - 'DAY-1/PROJECT'
          - 'Day-2/PROJECT-vpc-with-ec2'
          - 'Jenkins-Project'
          - 'aws-ec2'
          - 'aws-eks-cluster'
          - 'aws-s3'
          - 'aws-vpc'
          - 'aws-vpc-ec2-nginx'
          - 'azure-aks-cluster'
          - 'infrastructure/ec2'
          - 'pro-static-website'
          - 'tf_backend'

    defaults:
      run:
        working-directory: ./${{ matrix.working_dir }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Detect if THIS specific directory (or shared modules) actually changed
      - name: Check for changes in this folder
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            changed:
              - '${{ matrix.working_dir }}/**'
              - 'modules/**'  # If a shared module changes, it triggers everything!

      # 2. Only proceed with Terraform if files actually changed.
      # Setup + fmt need no AWS credentials, so they're safe to run even on
      # PRs from forks (helpful feedback for external contributors).
      - name: Setup Terraform
        if: steps.filter.outputs.changed == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"
          terraform_wrapper: false

      - name: Terraform Format
        if: steps.filter.outputs.changed == 'true'
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      # Everything below needs real AWS credentials, which GitHub does NOT
      # expose to pull_request runs triggered from a fork. Skip cleanly
      # instead of failing the job for external contributors.
      - name: Configure AWS Credentials
        if: >
          steps.filter.outputs.changed == 'true' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        if: >
          steps.filter.outputs.changed == 'true' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        id: init
        run: terraform init -input=false

      - name: Terraform Validate
        if: >
          steps.filter.outputs.changed == 'true' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        if: >
          steps.filter.outputs.changed == 'true' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        id: plan
        run: terraform plan -input=false -lock-timeout=300s -no-color -out=tfplan
        continue-on-error: true

      - name: Terraform Plan Status
        if: steps.filter.outputs.changed == 'true' && steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: steps.filter.outputs.changed == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -input=false -lock-timeout=300s -auto-approve tfplan
